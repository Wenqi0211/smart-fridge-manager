# SmartFridge HTTP API (Spring Boot)
server.port=8080
spring.application.name=smartfridge-api
smartfridge.jwt.secret=${SMARTFRIDGE_JWT_SECRET:}

# Reject fractional quantities and explicit null numeric fields instead of silently coercing them.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=true
