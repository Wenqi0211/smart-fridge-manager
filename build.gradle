/*
 * SmartFridge: console app (ui.Main) + optional HTTP API (api.SmartFridgeApiApplication).
 */
plugins {
    id 'application'
    id 'idea'
    id 'jacoco'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

apply plugin: 'java'

group = 'edu.cs5004'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    /** CLI entry (Gradle {@code run}). / 命令行入口 */
    mainClass.set('ui.Main')
}

springBoot {
    /** HTTP API entry (Gradle {@code bootRun}). / HTTP 服务入口 */
    mainClass = 'api.SmartFridgeApiApplication'
}

tasks.named('bootRun') {
    mainClass = 'api.SmartFridgeApiApplication'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.3'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.opencsv:opencsv:5.8'
    implementation 'com.fasterxml.woodstox:woodstox-core:6.5.0'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco { toolVersion = '0.8.12' }

// Measure all compiled production classes, including entry points and legacy CLI.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}
